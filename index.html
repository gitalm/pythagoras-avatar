<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-Avatar – per Webcam gesteuert (Ready Player Me + MediaPipe)</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; overflow:hidden; background:#101827; color:#f5f0e6; }
  #hud { position:fixed; z-index:5; inset:0; pointer-events:none; }
  .panel { background:rgba(12,23,39,.9); border:1px solid rgba(220,200,155,.4);
           border-radius:12px; padding:12px 16px; box-shadow:0 8px 30px #0006; pointer-events:auto; }
  #title { position:absolute; left:16px; top:16px; width:300px; }
  #title h1 { margin:0 0 4px; font:600 16px Georgia,serif; color:#f3d89b; }
  #title p { margin:0; font-size:12px; color:#d6e0e9; }
  
  #webcam-panel { position:absolute; left:16px; bottom:16px; width:280px; font-size:12px; }
  #webcam-container { position:relative; width:100%; height:140px; background:#000; border-radius:8px; overflow:hidden; margin-top:8px; }
  #webcam-video { position:absolute; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  
  .action-btn { border:1px solid #b69a61; background:#253d56; color:#fff5dc; border-radius:7px; padding:8px 12px; cursor:pointer; font-size:13px; width:100%; margin-top:8px; pointer-events:auto; text-align:center; display:block; }
  .action-btn:hover { background:#365574; }

  #bottom { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; width:min(600px, calc(100vw - 32px)); }
  #message { font:16px/1.4 Georgia,serif; text-align:center; }
</style>
<!-- Three.js r128 & GLTFLoader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<!-- MediaPipe Face Mesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="hud">
  <section id="title" class="panel">
    <h1>3D-Avatar im antiken Lernhof</h1>
    <p>Steuerung via Webcam & MediaPipe</p>
  </section>

  <section id="webcam-panel" class="panel">
    <strong>Webcam-Steuerung</strong>
    <div id="webcam-container">
      <video id="webcam-video" autoplay playsinline muted></video>
    </div>
    <button id="toggle-cam" class="action-btn">▶ Webcam starten</button>
    <button id="toggle-demo" class="action-btn" style="background:#174c80;">🕺 Demo-Modus</button>
  </section>

  <section id="bottom" class="panel">
    <div id="message">Willkommen! Starte die Webcam oder den Demo-Modus, um den Avatar zu bewegen.</div>
    <button id="speak" class="action-btn" style="margin-top:10px;">🗣️ Sprechen lassen (Satz des Pythagoras)</button>
  </section>
</div>

<script>
// Three.js Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ab5d8);
scene.fog = new THREE.Fog(0x8ab5d8, 10, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 3.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.inset = '0';
renderer.domElement.style.zIndex = '0';

// Lichtquellen
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

// Boden
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({color: 0xcbbd9e, roughness: 0.8})
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Avatar (Fallback bzw. Harry Potter / Ready Player Me kompatibles Skelett)
let avatarRoot = new THREE.Group();
scene.add(avatarRoot);

// Kopf und Körper für visuelles Feedback auch ohne GLTF
const bodyMat = new THREE.MeshStandardMaterial({color: 0x174c80});
const skinMat = new THREE.MeshStandardMaterial({color: 0xc99269});
const hairMat = new THREE.MeshStandardMaterial({color: 0x2b1d0c}); // Dunkles Haar (Harry Potter Stil)

const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.8, 16), bodyMat);
torso.position.y = 0.9;
torso.castShadow = true;
avatarRoot.add(torso);

const headGroup = new THREE.Group();
headGroup.position.set(0, 1.45, 0);
avatarRoot.add(headGroup);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), skinMat);
head.castShadow = true;
headGroup.add(head);

const hair = new THREE.Mesh(new THREE.SphereGeometry(0.23, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), hairMat);
hair.position.set(0, 0.05, -0.02);
headGroup.add(hair);

// Brille (Harry Potter Markenzeichen)
const glasses = new THREE.Group();
const frameMat = new THREE.MeshBasicMaterial({color: 0x111111});
const lGlass = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.008, 12, 24), frameMat);
lGlass.position.set(-0.07, 0.02, 0.2);
const rGlass = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.008, 12, 24), frameMat);
rGlass.position.set(0.07, 0.02, 0.2);
const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.01, 0.01), frameMat);
bridge.position.set(0, 0.04, 0.2);
glasses.add(lGlass, rGlass, bridge);
headGroup.add(glasses);

// Lade offizielles Ready Player Me Modell falls gewünscht, ansonsten bleibt der detaillierte Avatar aktiv
const loader = new THREE.GLTFLoader();
loader.load(
  'https://models.readyplayer.me/646c071acc84f2954f9a5676.glb',
  (gltf) => {
    avatarRoot.remove(torso);
    avatarRoot.remove(headGroup);
    const model = gltf.scene;
    model.scale.set(1.2, 1.2, 1.2);
    model.position.set(0, 0, 0);
    avatarRoot.add(model);
  },
  undefined,
  (error) => { console.log('Verwende integrierten Avatar-Fallback.'); }
);

// Webcam & MediaPipe Setup
const videoElement = document.getElementById('webcam-video');
let webcamActive = false;
let demoMode = false;
let targetHeadRotation = { x: 0, y: 0 };

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
  if (webcamActive && results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const lm = results.multiFaceLandmarks[0];
    const nose = lm[1], leftEar = lm[234], rightEar = lm[454];
    const dx = rightEar.x - leftEar.x;
    targetHeadRotation.y = (nose.x - (leftEar.x + rightEar.x) / 2) / dx * 1.5;
    targetHeadRotation.x = (nose.y - (leftEar.y + rightEar.y) / 2) * 1.2;
  }
});

const cameraUtils = new Camera(videoElement, {
  onFrame: async () => {
    if (webcamActive) {
      await faceMesh.send({ image: videoElement });
    }
  },
  width: 320,
  height: 240
});

document.getElementById('toggle-cam').onclick = async () => {
  webcamActive = !webcamActive;
  demoMode = false;
  if (webcamActive) {
    try {
      await cameraUtils.start();
      document.getElementById('toggle-cam').textContent = '⏹ Webcam stoppen';
      document.getElementById('toggle-cam').style.background = '#bd6656';
      document.getElementById('message').textContent = 'Webcam aktiv – bewege deinen Kopf!';
    } catch(e) {
      webcamActive = false;
      document.getElementById('message').textContent = 'Fehler beim Zugriff auf die Webcam.';
    }
  } else {
    cameraUtils.stop();
    document.getElementById('toggle-cam').textContent = '▶ Webcam starten';
    document.getElementById('toggle-cam').style.background = '#253d56';
  }
};

document.getElementById('toggle-demo').onclick = () => {
  demoMode = !demoMode;
  webcamActive = false;
  if (demoMode) {
    document.getElementById('toggle-demo').style.background = '#365574';
    document.getElementById('message').textContent = 'Demo-Modus aktiv: Der Avatar bewegt sich automatisch.';
  } else {
    document.getElementById('toggle-demo').style.background = '#174c80';
    document.getElementById('message').textContent = 'Demo-Modus beendet.';
  }
};

// Sprachausgabe
document.getElementById('speak').onclick = () => {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const text = "Im rechtwinkligen Dreieck ist die Summe der Flächeninhalt der Kathetenquadrate gleich dem Flächeninhalt des Hypotenusenquadrats. A Quadrat plus B Quadrat ist gleich C Quadrat.";
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.95;
  speechSynthesis.speak(u);
  
  // Kleiner Sprech-Effekt
  document.getElementById('message').textContent = '🗣️ ' + text;
};

// Resize Handler
window.addEventListener('resize', () => {
  camera.aspect = innerWidth /innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Animationsloop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  if (webcamActive) {
    headGroup.rotation.y = THREE.MathUtils.damp(headGroup.rotation.y, targetHeadRotation.y, 8, dt);
    headGroup.rotation.x = THREE.MathUtils.damp(headGroup.rotation.x, targetHeadRotation.x, 8, dt);
  } else if (demoMode) {
    headGroup.rotation.y = Math.sin(time * 1.5) * 0.4;
    headGroup.rotation.x = Math.cos(time * 1.0) * 0.2;
    avatarRoot.rotation.y = Math.sin(time * 0.5) * 0.2;
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
